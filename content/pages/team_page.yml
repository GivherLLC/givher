  - name: Alina Hernandez
    title: Founder & Principal
    imageSrc: /uploads/ahernandez.png
    iconLinks:
      - iconImageSrc: /uploads/mail-icon.svg
        darkmodeSrc: /uploads/mail-icon-darkmode.svg
        iconImageAlt: Email icon
        iconLink: mailto:alina@givher.com
    bio:
      - paragraph: Alina Hernandez (she/they) is known for their quiet yet influential
          presence. With a gift for making people feel heard and valued, Alina
          treats each individual with the star quality they inherently possess.
          This approach resonates deeply in every space they occupy. Alina's
          philosophy on life and strategy in the workplace is refreshingly
          unconventional. Alina is a unique example of authenticity, living a
          life marked by joy, creativity, and an unyielding commitment to
          treating everyone with kindness and respect.
      - paragraph: As the founder and principal of Givher, Alina has demonstrated
          exceptional leadership in fundraising, event development, and
          political hospitality, leveraging their extensive background in policy
          and advocacy. Before founding Givher, Alina played pivotal roles in
          advancing equality and civil rights, notably as Principal Consultant
          for the California Legislative LGBTQ Caucus and President of the
          Capitol LGBTQ Association. This blend of personal attributes and
          professional accomplishments makes Alina Hernandez an exemplary
          leader, uniquely equipped to guide Givher toward impactful and
          meaningful success.
